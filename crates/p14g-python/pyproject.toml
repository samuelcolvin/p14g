[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "p14g"
description = "Check untrusted SQL against an allowlist and rewrite it so it is safe to run on Postgres."
requires-python = ">=3.11"
authors = [{ name = "Samuel Colvin", email = "s@muelcolvin.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "../../README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Database",
    "Topic :: Security",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/samuelcolvin/p14g"
Source = "https://github.com/samuelcolvin/p14g"

[tool.maturin]
module-name = "p14g"
bindings = "pyo3"
features = ["pyo3/extension-module"]

[tool.uv]
# rebuild on `uv sync` when the Rust code or the stub changes, not only when this file does
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "p14g.pyi" },
    { file = "src/**/*.rs" },
    { file = "../p14g/Cargo.toml" },
    { file = "../p14g/src/**/*.rs" },
    { file = "../../Cargo.toml" },
    { file = "../../Cargo.lock" },
]
