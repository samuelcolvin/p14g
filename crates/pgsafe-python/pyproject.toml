[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pgsafe"
description = "Check untrusted SQL against an allowlist and rewrite it so it is safe to run on Postgres."
requires-python = ">=3.10"
authors = [{ name = "Samuel Colvin", email = "s@muelcolvin.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Database",
    "Topic :: Security",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/samuelcolvin/pgsafe"
Source = "https://github.com/samuelcolvin/pgsafe"

[tool.maturin]
module-name = "pgsafe"
bindings = "pyo3"
features = ["pyo3/extension-module"]
