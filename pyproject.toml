[dependency-groups]
dev = [
    "maturin>=1.9",
    "pytest",
    "pytest-pretty",
    "dirty-equals",
    # runs the python examples in README.md and checks their `#>` output
    "pytest-examples",
]
linting = [
    "ruff",
    "basedpyright",
    # for `python -m mypy.stubtest`, which checks p14g.pyi against the built module
    "mypy",
]
# for the LLM fuzzer in crates/fuzz-agent
fuzz-agent = [
    "pydantic-ai-slim[openai]",
    "psycopg[binary]",
    # Postgres's own parser, to check what p14g emits
    "pglast",
    "logfire[psycopg]",
    "pydantic-ai-harness[code-mode]>=0.68.0",
]

[tool.uv]
# only use package versions that have been published for at least 7 days
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["crates/p14g-python"]

[tool.uv.sources]
p14g = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["crates/p14g-python/tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "Q",      # https://docs.astral.sh/ruff/rules/#flake8-quotes-q
    "RUF100", # https://docs.astral.sh/ruff/rules/unused-noqa/
    "I",      # https://docs.astral.sh/ruff/rules/#isort-i
    "FA",     # https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
    "UP",     # https://docs.astral.sh/ruff/rules/#pyupgrade-up
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "single"

[tool.basedpyright]
include = ["crates/p14g-python/p14g.pyi", "crates/p14g-python/tests", "crates/fuzz-agent"]
# the fuzz agent's runs, and hidden directories such as its copy of the repository, `.library`
exclude = ["crates/fuzz-agent/runs", "**/__pycache__", "**/.*"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingModuleSource = false
stubPath = "crates/p14g-python"
