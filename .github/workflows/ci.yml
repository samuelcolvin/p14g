name: ci

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request: {}

permissions: {}

env:
  UV_LOCKED: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - run: rustup default stable

      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[cache-poisoning]

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - run: uv sync --all-groups --all-packages

      - run: make lint

  test:
    name: test rust-${{ matrix.rust-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-version: [stable, '1.88']

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGSAFE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-version }}

      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[cache-poisoning]

      - run: cargo test --workspace

  test-python:
    name: test python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[cache-poisoning]

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - run: make python-test

  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [check, mutate]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[cache-poisoning]
        with:
          workspaces: crates/fuzz

      - run: cargo install cargo-fuzz --locked

      - run: cargo fuzz run --fuzz-dir crates/fuzz "$TARGET" --release -- -max_total_time=120
        env:
          TARGET: ${{ matrix.target }}

  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          working-directory: crates/pgsafe-python

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: crates/pgsafe-python/dist

  # https://github.com/marketplace/actions/alls-green#why used for branch protection checks
  check:
    if: always()
    needs: [lint, test, test-python, fuzz, build]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
